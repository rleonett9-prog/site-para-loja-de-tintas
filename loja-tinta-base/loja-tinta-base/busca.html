<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca - FixTintas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav>
        <div class="container">
            <img src="logo.png" alt="Logo FixTintas" class="navbar-logo">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="index.html#sobre">Sobre</a></li>
                <li><a href="index.html#contato">Contato</a></li>
            </ul>
            <div class="busca-wrapper">
                <div class="barra-busca">
                    <input type="text" id="input-busca" placeholder="Buscar produtos...">
                    <button id="btn-busca">🔍</button>
                </div>
                <div class="dropdown-busca" id="dropdown-busca"></div>
            </div>
            <button class="btn-carrinho" onclick="abrirCarrinho()">🛒 <span id="carrinho-badge">0</span></button>
            <button class="btn-login" onclick="abrirLogin()">👤 Login</button>
        </div>
    </nav>

    <main style="padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
        <h2 id="titulo-busca" style="color:#1a2a6c; margin-bottom: 8px;">Resultados da busca</h2>
        <p id="subtitulo-busca" style="color:#888; margin-bottom: 30px;"></p>
        <div class="grid-produtos" id="resultados-lista"></div>
    </main>
         <div>

    <footer>
            <p>&copy; 2026 FixTintas. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Modal Login/Registro -->
    <div id="modal-login" class="modal-overlay" style="display:none">
        <div class="modal-box">
            <button class="modal-fechar" onclick="fecharLogin()">✕</button>
            <div class="modal-abas">
                <button class="aba ativa" onclick="trocarAba('login')">Entrar</button>
                <button class="aba" onclick="trocarAba('registro')">Cadastrar</button>
            </div>
            <div id="form-login" class="form-modal">
                <h2>Bem-vindo de volta!</h2>
                <input type="email" placeholder="E-mail">
                <input type="password" placeholder="Senha">
                <button class="btn-submit">Entrar</button>
                <p class="link-form">Esqueceu a senha? <a href="#">Recuperar</a></p>
            </div>
            <div id="form-registro" class="form-modal" style="display:none">
                <h2>Crie sua conta</h2>
                <input type="text" placeholder="Nome completo">
                <input type="text" placeholder="CPF">
                <input type="date" id="data-nascimento">
                <input type="tel" placeholder="Telefone">
                <input type="email" placeholder="E-mail">
                <input type="password" placeholder="Senha">
                <input type="password" placeholder="Confirmar senha">
                <button class="btn-submit" id="btn-cadastrar">Cadastrar</button>
            </div>
        </div>
    </div>

    <!-- Painel Carrinho -->
    <div id="painel-carrinho" class="carrinho-overlay" style="display:none">
        <div class="carrinho-box">
            <div class="carrinho-header">
                <h2>🛒 Meu Carrinho</h2>
                <button class="modal-fechar" onclick="fecharCarrinho()">✕</button>
            </div>
            <div id="carrinho-lista">
                <p class="carrinho-vazio">Carrinho vazio</p>
            </div>
            <div class="carrinho-rodape">
                <div class="carrinho-total" id="carrinho-total">Total: R$ 0,00</div>
                <button class="btn-finalizar">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- Modal Produto -->
    <div id="modal-produto" class="modal-overlay" style="display:none">
        <div class="modal-box modal-produto-box">
            <button class="modal-fechar" onclick="fecharModalProduto()">✕</button>
            <div class="modal-produto-header">
                <div class="modal-produto-imagem" id="modal-img"></div>
                <div>
                    <h2 id="modal-nome"></h2>
                    <p class="preco" id="modal-preco"></p>
                </div>
            </div>
            <div class="modal-opcao" id="secao-cor">
                <label>Cor</label>
                <div class="cores-grid" id="modal-cores">
                    <div class="cor-item" data-cor="Branco" style="background:#ffffff;border:1px solid #ddd" title="Branco"></div>
                    <div class="cor-item" data-cor="Marfim" style="background:#fffff0;border:1px solid #ddd" title="Marfim"></div>
                    <div class="cor-item" data-cor="Areia" style="background:#c2b280" title="Areia"></div>
                    <div class="cor-item" data-cor="Cinza Claro" style="background:#d3d3d3" title="Cinza Claro"></div>
                    <div class="cor-item" data-cor="Cinza Escuro" style="background:#696969" title="Cinza Escuro"></div>
                    <div class="cor-item" data-cor="Azul Claro" style="background:#add8e6" title="Azul Claro"></div>
                    <div class="cor-item" data-cor="Azul Escuro" style="background:#00008b" title="Azul Escuro"></div>
                    <div class="cor-item" data-cor="Verde Claro" style="background:#90ee90" title="Verde Claro"></div>
                    <div class="cor-item" data-cor="Verde Escuro" style="background:#006400" title="Verde Escuro"></div>
                    <div class="cor-item" data-cor="Amarelo" style="background:#ffd700" title="Amarelo"></div>
                    <div class="cor-item" data-cor="Laranja" style="background:#ffa500" title="Laranja"></div>
                    <div class="cor-item" data-cor="Vermelho" style="background:#cc0000" title="Vermelho"></div>
                    <div class="cor-item" data-cor="Rosa" style="background:#ffb6c1" title="Rosa"></div>
                    <div class="cor-item" data-cor="Roxo" style="background:#800080" title="Roxo"></div>
                    <div class="cor-item" data-cor="Marrom" style="background:#8b4513" title="Marrom"></div>
                    <div class="cor-item" data-cor="Preto" style="background:#000000" title="Preto"></div>
                </div>
                <p id="cor-selecionada" style="font-size:0.85rem; color:#888; margin-top:6px;">Nenhuma cor selecionada</p>
            </div>
            <div class="modal-opcao" id="secao-volume">
                <label id="label-volume">Volume</label>
                <div class="opcoes-botoes" id="modal-volumes"></div>
            </div>
            <div class="modal-opcao" id="secao-acabamento">
                <label>Acabamento</label>
                <div class="opcoes-botoes" id="modal-acabamentos">
                    <button class="opcao-btn" data-valor="Fosco">Fosco</button>
                    <button class="opcao-btn" data-valor="Acetinado">Acetinado</button>
                    <button class="opcao-btn" data-valor="Brilhante">Brilhante</button>
                </div>
            </div>
            <div class="modal-opcao">
                <label>Quantidade</label>
                <div class="quantidade-controle">
                    <button onclick="alterarQtd(-1)">−</button>
                    <span id="modal-qtd">1</span>
                    <button onclick="alterarQtd(1)">+</button>
                </div>
            </div>
            <div class="modal-opcao">
                <label>Descrição</label>
                <p id="modal-descricao" style="font-size:0.9rem; color:#555; line-height:1.6;"></p>
            </div>
            <button class="btn-submit" onclick="adicionarModalAoCarrinho()">🛒 Adicionar ao Carrinho</button>
        </div>
    </div>

    <script src="script.js"></script>
    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
</body>
</html>
